server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the public read API so the static JS can call same-origin relative paths
  # (no CORS configuration needed, no backend URL baked into the static bundle).
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
  }
}
