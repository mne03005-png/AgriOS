upstream agrios_api {
    server 127.0.0.1:3200;
    keepalive 16;
}

upstream agrios_web {
    server 127.0.0.1:3201;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name agrios.xyzwtt.com agrios-api.xyzwtt.com agrios-mqtt.xyzwtt.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrios-mqtt.xyzwtt.com;

    ssl_certificate /etc/letsencrypt/live/agrios-mqtt.xyzwtt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrios-mqtt.xyzwtt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        default_type text/plain;
        return 404 "MQTT is available on TLS port 8883.\n";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrios.xyzwtt.com;

    ssl_certificate /etc/letsencrypt/live/agrios.xyzwtt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrios.xyzwtt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AGRIOS_WEB_SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        return 302 /agrios;
    }

    location / {
        proxy_pass http://agrios_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 130s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrios-api.xyzwtt.com;

    ssl_certificate /etc/letsencrypt/live/agrios-api.xyzwtt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrios-api.xyzwtt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AGRIOS_API_SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://agrios_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 130s;
    }

    location = /healthz {
        proxy_pass http://agrios_api/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

# MQTT TLS is terminated directly by agrios-mosquitto on TCP/8883.
# The agrios-mqtt.xyzwtt.com certificate is mounted into that container;
# Nginx does not proxy MQTT and therefore cannot affect AEOS HTTP traffic.
