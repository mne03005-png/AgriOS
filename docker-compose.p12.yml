services:
  mysql:
    image: mysql:8.4
    container_name: agrios-p12-mysql
    environment:
      MYSQL_ROOT_PASSWORD: REPLACE_WITH_STRONG_ROOT_PASSWORD
      MYSQL_DATABASE: agrios
      MYSQL_USER: agrios
      MYSQL_PASSWORD: REPLACE_WITH_STRONG_DB_PASSWORD
    ports:
      - "3306:3306"
    volumes:
      - agrios-p12-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagrios", "-pagrios_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agrios-p12-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: agrios-p12-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://agrios:REPLACE_WITH_STRONG_DB_PASSWORD@mysql:3306/agrios
      REDIS_URL: redis://redis:6379
      JWT_SECRET: REPLACE_WITH_LONG_RANDOM_SECRET
      JWT_EXPIRES_IN: 7d
      ENABLE_AUTO_EXECUTION: "false"
      DEVICE_CONTROL_MODE: MOCK
      UPLOAD_MAX_FILE_MB: "20"
      CORS_ORIGINS: http://localhost:5174,http://localhost:5173
      ACTION_QUEUE_DRIVER: memory
      ACTION_QUEUE_MAX_RETRIES: "3"
    ports:
      - "3000:3000"

volumes:
  agrios-p12-mysql-data:
