name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://agrios:agrios@127.0.0.1:3306/agrios
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      DEVICE_ACK_HMAC_SECRET: ci-only-device-ack-secret-at-least-32-chars
      ENABLE_AUTO_EXECUTION: "false"
      DEVICE_CONTROL_MODE: MOCK
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace apps/backend

      - name: Build backend workspace dependencies
        run: npm run build --workspace packages/edge-core

      - name: Type check backend
        run: npx tsc --project apps/backend/tsconfig.json --noEmit --incremental false

      - name: Run backend contract tests
        run: |
          npm run test:stage2 --workspace apps/backend
          npm run test:stage3 --workspace apps/backend
          npm run test:stage4 --workspace apps/backend
          npm run test:phase-a --workspace apps/backend

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate local demo stack
        run: docker compose --file docker-compose.yml config --quiet
